<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O Meu Site</title>
  <meta name="description" content="Uma breve descrição do meu site.">
  <style>
    * { box-sizing: border-box; }
    html { font-size: clamp(16px, 1.2vw + 12px, 22px); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(1rem, 5vw, 4rem);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #fff;
      background: #003893;
      text-align: center;
    }
    main { flex: 1; }
    header, footer { padding: 1.5rem 0; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1rem; }
    nav a { color: #fff; }
    footer { border-top: 1px solid rgba(255, 255, 255, 0.4); font-size: 0.9rem; }
    #game {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
      margin: 0 auto;
      background: #002a70;
      border-radius: 8px;
      touch-action: none;
    }
    .controls { display: flex; gap: 0.5rem; max-width: 800px; margin: 0.75rem auto 1.5rem; }
    .controls button {
      flex: 1;
      padding: 0.75rem;
      font: inherit;
      color: #fff;
      background: transparent;
      border: 2px solid #fff;
      border-radius: 8px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .controls button:active { background: rgba(255, 255, 255, 0.25); }
    .controls button:focus-visible { outline: 3px solid #ffd54a; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Jump!</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="about.html">Sobre</a>
      <a href="contact.html">Contactos</a>
    </nav>
  </header>

  <main>
    <h2>Jogo de saltos</h2>
    <p>Chegue à bandeira em cada um dos 3 níveis. Mova-se com as setas ou com A/D, salte com Cima, W ou Espaço e prima R para reiniciar o nível.</p>
    <p id="status" aria-live="polite"></p>
    <canvas id="game" width="640" height="360" aria-label="Jogo de plataformas com saltos"></canvas>
    <div class="controls">
      <button type="button" data-key="left" aria-label="Mover para a esquerda">Esquerda</button>
      <button type="button" data-key="jump" aria-label="Saltar">Saltar</button>
      <button type="button" data-key="right" aria-label="Mover para a direita">Direita</button>
    </div>
  </main>

  <footer>
  </footer>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var ctx = canvas.getContext('2d');
      var statusEl = document.getElementById('status');
      var W = canvas.width, H = canvas.height;

      // Rectangles are [x, y, width, height]
      var levels = [
        {
          start: [20, 300],
          plats: [[0, 320, 140, 40], [200, 280, 80, 16], [330, 240, 80, 16], [460, 200, 80, 16], [570, 150, 70, 16]],
          hazards: [],
          goal: [600, 110, 16, 40]
        },
        {
          start: [20, 300],
          plats: [[0, 320, 100, 40], [150, 270, 50, 14], [250, 220, 50, 14], [150, 170, 50, 14], [250, 120, 50, 14], [370, 120, 60, 14], [480, 170, 50, 14], [570, 220, 70, 14]],
          hazards: [],
          goal: [600, 180, 16, 40]
        },
        {
          start: [20, 300],
          plats: [[0, 320, 120, 40], [170, 290, 110, 14], [330, 250, 110, 14], [490, 210, 150, 14]],
          hazards: [[215, 276, 16, 14], [375, 236, 16, 14]],
          goal: [600, 170, 16, 40]
        }
      ];

      var keys = { left: false, right: false, jump: false };
      var lvl = 0, falls = 0, won = false, p;

      function load(i) {
        lvl = i;
        var s = levels[i].start;
        p = { x: s[0], y: s[1], w: 20, h: 20, vx: 0, vy: 0, ground: false };
        updateStatus();
      }

      function updateStatus() {
        statusEl.textContent = won
          ? 'Terminou todos os níveis com ' + falls + ' quedas. Prima Saltar para jogar de novo.'
          : 'Nível ' + (lvl + 1) + ' de ' + levels.length + '. Quedas: ' + falls;
      }

      function overlap(a, r) {
        return a.x < r[0] + r[2] && a.x + a.w > r[0] && a.y < r[1] + r[3] && a.y + a.h > r[1];
      }

      function step() {
        var L = levels[lvl];
        p.vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 3.2;
        p.x += p.vx;
        L.plats.forEach(function (r) {
          if (overlap(p, r)) {
            if (p.vx > 0) p.x = r[0] - p.w;
            else if (p.vx < 0) p.x = r[0] + r[2];
          }
        });
        p.x = Math.max(0, Math.min(W - p.w, p.x));

        if (keys.jump && p.ground) p.vy = -9.5;
        p.vy = Math.min(p.vy + 0.5, 12);
        p.y += p.vy;
        p.ground = false;
        L.plats.forEach(function (r) {
          if (overlap(p, r)) {
            if (p.vy > 0) { p.y = r[1] - p.h; p.ground = true; }
            else if (p.vy < 0) { p.y = r[1] + r[3]; }
            p.vy = 0;
          }
        });

        var hit = p.y > H + 40 || L.hazards.some(function (h) {
          return overlap({ x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 6 }, [h[0] + 3, h[1] + 3, h[2] - 6, h[3] - 3]);
        });
        if (hit) { falls++; load(lvl); return; }

        if (overlap(p, L.goal)) {
          if (lvl < levels.length - 1) load(lvl + 1);
          else { won = true; updateStatus(); }
        }
      }

      function draw() {
        var L = levels[lvl];
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        L.plats.forEach(function (r) { ctx.fillRect(r[0], r[1], r[2], r[3]); });

        ctx.fillStyle = '#ff5a5a';
        L.hazards.forEach(function (h) {
          ctx.beginPath();
          ctx.moveTo(h[0], h[1] + h[3]);
          ctx.lineTo(h[0] + h[2] / 2, h[1]);
          ctx.lineTo(h[0] + h[2], h[1] + h[3]);
          ctx.closePath();
          ctx.fill();
        });

        var g = L.goal;
        ctx.fillStyle = '#fff';
        ctx.fillRect(g[0], g[1], 3, g[3]);
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath();
        ctx.moveTo(g[0] + 3, g[1]);
        ctx.lineTo(g[0] + g[2] + 6, g[1] + 8);
        ctx.lineTo(g[0] + 3, g[1] + 16);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffd54a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#003893';
        ctx.fillRect(p.x + 5, p.y + 5, 3, 4);
        ctx.fillRect(p.x + 12, p.y + 5, 3, 4);

        if (won) {
          ctx.fillStyle = 'rgba(0, 42, 112, 0.85)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 32px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Venceu!', W / 2, H / 2);
        }
      }

      var last = 0, acc = 0, STEP = 1000 / 60;
      function frame(t) {
        if (!last) last = t;
        acc += Math.min(t - last, 100);
        last = t;
        while (acc >= STEP) { if (!won) step(); acc -= STEP; }
        draw();
        requestAnimationFrame(frame);
      }

      function press(k, down) {
        keys[k] = down;
        if (down && k === 'jump' && won) { won = false; falls = 0; load(0); }
      }

      var map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' };
      window.addEventListener('keydown', function (e) {
        var k = map[e.code];
        if (k) { e.preventDefault(); press(k, true); }
        else if (e.code === 'KeyR' && !won) load(lvl);
      });
      window.addEventListener('keyup', function (e) {
        var k = map[e.code];
        if (k) press(k, false);
      });

      document.querySelectorAll('.controls button').forEach(function (b) {
        var k = b.dataset.key;
        b.addEventListener('pointerdown', function (e) { e.preventDefault(); press(k, true); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
          b.addEventListener(ev, function () { press(k, false); });
        });
        b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      });

      load(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
