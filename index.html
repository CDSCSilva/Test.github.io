<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <meta name="description" content="A short description of my website.">
  <style>
    * { box-sizing: border-box; }
    html { font-size: clamp(16px, 1.2vw + 12px, 22px); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(1rem, 5vw, 4rem);
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #fff;
      background: #003893;
    }
    main { flex: 1; }
    header, footer { padding: 1.5rem 0; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    nav a { color: #fff; }
    footer { border-top: 1px solid rgba(255, 255, 255, 0.4); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
    <nav>
    </nav>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>This is the home page. Replace this text with a short introduction to your site.</p>
  </main>

  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>
</body>
</html>
